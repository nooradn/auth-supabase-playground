<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase Auth Playground</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f5;
      --surface: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --muted: #71717a;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --green: #16a34a;
      --red: #dc2626;
      --yellow: #ca8a04;
      --blue: #2563eb;
      --font: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    header .status {
      margin-left: auto;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    header .status.authenticated { border-color: var(--green); color: var(--green); }
    header .status.unauthenticated { border-color: var(--muted); color: var(--muted); }

    .container {
      display: grid;
      grid-template-columns: 1fr 380px;
      flex: 1;
      overflow: hidden;
    }

    /* ── Logs Panel ── */
    .logs-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }

    .logs-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .logs-header h2 { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .logs-header .count { font-size: 11px; color: var(--muted); margin-left: auto; }
    .logs-header button {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--font);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .logs-header button:hover { border-color: var(--red); color: var(--red); }

    #logs {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .log-entry {
      padding: 6px 16px;
      font-size: 12px;
      line-height: 1.6;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } }

    .log-entry .log-time { color: var(--muted); margin-right: 8px; }
    .log-entry .log-type {
      font-size: 10px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 3px;
      margin-right: 8px;
      text-transform: uppercase;
      display: inline-block;
    }
    .log-entry .log-type.info { background: rgba(59,130,246,0.15); color: var(--blue); }
    .log-entry .log-type.success { background: rgba(34,197,94,0.15); color: var(--green); }
    .log-entry .log-type.error { background: rgba(239,68,68,0.15); color: var(--red); }
    .log-entry .log-type.warn { background: rgba(234,179,8,0.15); color: var(--yellow); }
    .log-entry .log-type.action { background: rgba(139,92,246,0.15); color: var(--accent); }
    .log-entry pre {
      margin-top: 4px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    /* ── Forms Panel ── */
    .forms-panel {
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding: 12px 0 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .section-title:first-child { padding-top: 0; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 6px;
    }

    .form-group label {
      font-size: 11px;
      color: var(--muted);
    }

    .form-group input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus { border-color: var(--accent); }

    .btn {
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }

    .btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-outline:hover:not(:disabled) { border-color: var(--text); }

    .btn-danger { background: transparent; border-color: var(--red); color: var(--red); }
    .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.1); }

    .btn-green { background: var(--green); color: #000; }
    .btn-green:hover:not(:disabled) { opacity: 0.9; }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .user-card .field { color: var(--muted); margin-bottom: 2px; }
    .user-card .field span { color: var(--text); word-break: break-all; }

    #logs::-webkit-scrollbar, .forms-panel::-webkit-scrollbar { width: 6px; }
    #logs::-webkit-scrollbar-track, .forms-panel::-webkit-scrollbar-track { background: transparent; }
    #logs::-webkit-scrollbar-thumb, .forms-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>Supabase Auth Playground</h1>
    <span id="statusBadge" class="status unauthenticated">No Session</span>
  </header>

  <div class="container">
    <!-- Logs Panel -->
    <div class="logs-panel">
      <div class="logs-header">
        <h2>Logs</h2>
        <span id="logCount" class="count">0</span>
        <button onclick="clearLogs()">Clear</button>
      </div>
      <div id="logs"></div>
    </div>

    <!-- Forms Panel -->
    <div class="forms-panel">
      <!-- Current User -->
      <div class="section-title">Current Session</div>
      <div id="userCard" class="user-card" style="display:none">
        <div class="field">ID: <span id="userId"></span></div>
        <div class="field">Email: <span id="userEmail"></span></div>
      </div>

      <!-- Sign Up -->
      <div class="section-title">Sign Up (Email + Password)</div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password (min 6 chars)</label>
        <input type="password" id="signupPassword" placeholder="••••••••" />
      </div>
      <button class="btn btn-primary" onclick="signUp()">Sign Up</button>

      <div class="divider"></div>

      <!-- Sign In -->
      <div class="section-title">Sign In</div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signinEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signinPassword" placeholder="••••••••" />
      </div>
      <div class="btn-row">
        <button class="btn btn-green" onclick="signIn()">Email + Password</button>
        <button class="btn btn-outline" onclick="signInOtp()">Magic Link (OTP)</button>
      </div>

      <div class="divider"></div>

      <!-- Session / User -->
      <div class="section-title">Session & User</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="getSession()">Get Session</button>
        <button class="btn btn-outline" onclick="getUser()">Get User</button>
      </div>

      <div class="divider"></div>

      <!-- Password Reset -->
      <div class="section-title">Password Reset</div>
      <div class="form-group">
        <label>Email for reset link</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" />
      </div>
      <button class="btn btn-outline" onclick="resetPassword()">Send Reset Link</button>

      <div class="divider"></div>

      <!-- Update Password -->
      <div class="section-title">Update Password (logged in)</div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" />
      </div>
      <button class="btn btn-outline" onclick="updatePassword()">Update Password</button>

      <div class="divider"></div>

      <!-- Sign Out -->
      <div class="section-title">Danger Zone</div>
      <button class="btn btn-danger" onclick="signOut()">Sign Out</button>
    </div>
  </div>

  <script>
    // ─── Init ──────────────────────────────────────────────
    const SUPABASE_URL  = 'https://moekyeviywfdkvtcvqsu.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_vRr5qVC9K7DvrMem-ceEyQ_hjHd19-x';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let logCount = 0;

    // ─── Logging ───────────────────────────────────────────
    function log(type, message, data) {
      const logsEl = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const dataBlock = data !== undefined ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : '';
      entry.innerHTML = `
        <span class="log-time">${time}</span>
        <span class="log-type ${type}">${type}</span>
        ${message}
        ${dataBlock}
      `;
      logsEl.prepend(entry);
      logCount++;
      document.getElementById('logCount').textContent = logCount;
    }

    function clearLogs() {
      document.getElementById('logs').innerHTML = '';
      logCount = 0;
      document.getElementById('logCount').textContent = 0;
    }

    // ─── Status Badge ──────────────────────────────────────
    async function refreshStatus() {
      const badge = document.getElementById('statusBadge');
      const card = document.getElementById('userCard');
      const { data: { session } } = await client.auth.getSession();

      if (session) {
        badge.className = 'status authenticated';
        badge.textContent = 'Authenticated';
        card.style.display = 'block';
        document.getElementById('userId').textContent = session.user.id;
        document.getElementById('userEmail').textContent = session.user.email || '(no email)';
      } else {
        badge.className = 'status unauthenticated';
        badge.textContent = 'No Session';
        card.style.display = 'none';
      }
    }

    // ─── Auth Actions ──────────────────────────────────────
    async function signUp() {
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      log('action', `signUp("${email}")`);

      const { data, error } = await client.auth.signUp({ email, password });
      if (error) {
        log('error', error.message, error);
      } else {
        log('success', 'signUp — check email for confirmation', data);
        if (data.session) {
          log('info', 'User auto-signed-in (email confirmation may be disabled)');
        }
      }
      refreshStatus();
    }

    async function signIn() {
      const email = document.getElementById('signinEmail').value.trim();
      const password = document.getElementById('signinPassword').value;
      log('action', `signIn("${email}")`);

      const { data, error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        log('error', error.message, error);
      } else {
        log('success', 'signIn success', { user: data.user, session: data.session });
      }
      refreshStatus();
    }

    async function signInOtp() {
      const email = document.getElementById('signinEmail').value.trim();
      log('action', `signInOtp("${email}") — magic link / OTP`);

      const { data, error } = await client.auth.signInWithOtp({ email });
      if (error) {
        log('error', error.message, error);
      } else {
        log('success', 'OTP sent — check your email', data);
      }
    }

    async function getSession() {
      log('action', 'getSession()');
      const { data: { session }, error } = await client.auth.getSession();
      if (error) {
        log('error', error.message, error);
      } else if (session) {
        log('success', 'Active session found', session);
      } else {
        log('warn', 'No active session');
      }
    }

    async function getUser() {
      log('action', 'getUser()');
      const { data: { user }, error } = await client.auth.getUser();
      if (error) {
        log('error', error.message, error);
      } else if (user) {
        log('success', 'User info', user);
      } else {
        log('warn', 'No user');
      }
    }

    async function resetPassword() {
      const email = document.getElementById('resetEmail').value.trim();
      log('action', `resetPassword("${email}")`);

      const { data, error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.href,
      });
      if (error) {
        log('error', error.message, error);
      } else {
        log('success', 'Password reset email sent', data);
      }
    }

    async function updatePassword() {
      const newPassword = document.getElementById('newPassword').value;
      log('action', 'updatePassword()');

      const { data, error } = await client.auth.updateUser({ password: newPassword });
      if (error) {
        log('error', error.message, error);
      } else {
        log('success', 'Password updated', data);
      }
    }

    async function signOut() {
      log('action', 'signOut()');
      const { error } = await client.auth.signOut();
      if (error) {
        log('error', error.message, error);
      } else {
        log('success', 'Signed out');
      }
      refreshStatus();
    }

    // ─── Auth State Listener ───────────────────────────────
    client.auth.onAuthStateChange((event, session) => {
      log('info', `onAuthStateChange: ${event}`, session ? { user: session.user?.email, expires: session.expires_at } : null);
      refreshStatus();
    });

    // ─── Init ──────────────────────────────────────────────
    log('info', 'Supabase client initialized');
    log('info', `URL: ${SUPABASE_URL}`);
    refreshStatus();
  </script>
</body>
</html>
